<!DOCTYPE html>

<html lang="en"><head>

<style>
                :root {
                        background: #eef0f2;
                }

                body {
                        margin: 0;
                        min-height: 100vh;
                        background: #eef0f2;
                        font-family: "Hanken Grotesk", sans-serif;
                }

                .login-shell {
                        display: grid;
                        grid-template-columns: 50% 50%;
                        width: 100%;
                        min-height: 100vh;
                }

                .login-branding {
                        position: relative;
                        display: flex;
                        min-height: 100vh;
                        align-items: center;
                        justify-content: center;
                        overflow: hidden;
                        padding: 48px;
                        color: #fff;
                        text-align: center;
                        background: linear-gradient(145deg, #07183d, #061538);
                }

                .login-branding::before {
                        content: "";
                        position: absolute;
                        inset: 0;
                        background: url("photo-1782729433827-b5d43a30973f.avif") center / cover no-repeat;
                        opacity: .55;
                }

                .login-branding::after {
                        content: "";
                        position: absolute;
                        inset: 0;
                        background: linear-gradient(145deg, rgba(7, 24, 61, .42), rgba(6, 21, 56, .88));
                }

                .branding-content { position: relative; z-index: 1; max-width: 420px; }
                .branding-icon {
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        width: 72px;
                        height: 72px;
                        margin-bottom: 24px;
                        border-radius: 16px;
                        color: #fff;
                        background: #fff;
                }
                .branding-logo { width: 56px; height: 56px; object-fit: contain; border-radius: 10px; }
                .branding-content h1 { margin: 0; font-size: 42px; line-height: 1.1; }
                .branding-content p { margin: 12px 0 0; color: #dce7ff; font-size: 18px; }
                .branding-rule { width: 64px; height: 1px; margin: 32px auto; background: rgba(220, 231, 255, .4); }
                .branding-label { text-transform: uppercase; letter-spacing: .14em; font-size: 12px !important; }

                .login-form-panel {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        padding: 48px;
                        background: #fff;
                }

                @media (max-width: 800px) {
                        .login-shell { grid-template-columns: 1fr; }
                        .login-branding { display: none; }
                        .login-form-panel { min-height: 100vh; padding: 32px 24px; }
                }
        </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex antialiased">
<main class="login-shell">
<section class="login-branding" aria-label="Project X device management">
<div class="branding-content">
<div class="branding-icon"><img class="branding-logo" src="Project X.png" alt="Project X logo"></div>
<h1>Project X</h1>
<p>Device Management &amp; Licensing</p>
<div class="branding-rule"></div>
<p class="branding-label">Secure. Activate. Work.</p>
</div>
</section>
<section class="login-form-panel">
<section class="w-full max-w-md">
<div class="text-center mb-10">
<h1 class="font-display text-3xl font-bold text-on-surface mb-2">Lets Get Started</h1>
<p class="font-body-md text-on-surface-variant">Enter your credentials to proceed</p>
</div>
<form class="space-y-4" action="#" method="POST">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">store</span>
<input class="w-full pl-12 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none" name="dealerName" placeholder="Dealers name" required type="text">
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full pl-12 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none" name="email" placeholder="Email or Phone Number" required type="text">
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input id="password" class="w-full pl-12 pr-12 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none" name="password" placeholder="Password" required type="password">
<button id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant" type="button" aria-label="Show password"><span class="material-symbols-outlined">visibility</span></button>
</div>
<div class="flex items-center justify-between text-sm">
<a class="text-primary hover:underline" href="#">Forgot password?</a>
</div>
<button class="w-full py-3 rounded-lg bg-primary-container text-on-primary-container font-semibold hover:bg-primary transition-colors"  href="Registration.html"type="submit">Sign In</button>
</form>
<p class="mt-8 text-center text-sm text-on-surface-variant">Don't have an account? <a class="text-primary font-semibold hover:underline" href="Registration.html">Create one</a></p>
</section>
</section>
</main>
<footer class="fixed bottom-0 left-0 w-full flex justify-between items-center px-8 py-3 bg-white border-t border-outline-variant text-sm text-on-surface-variant">
<span>v1.0.0</span><span><span class="material-symbols-outlined align-middle text-green-600 text-base">lock</span> Secure Connection</span>
</footer>
<script>
const password = document.getElementById('password');
const togglePassword = document.getElementById('togglePassword');
togglePassword.addEventListener('click', () => {
        const isPassword = password.type === 'password';
        password.type = isPassword ? 'text' : 'password';
        togglePassword.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
});
</script>
</body></html>
