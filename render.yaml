databases:
  - name: project-x-db
    databaseName: project_x
    user: project_x
    plan: free

services:
  - type: web
    name: project-x-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --include=dev && npm --workspace @project-x/api run prisma:generate && npm --workspace @project-x/api run build
    startCommand: npm --workspace @project-x/api run prisma:migrate:deploy && npm --workspace @project-x/api run seed && npm --workspace @project-x/api run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: project-x-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: PAYMENT_PORTAL_BASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: LICENSE_PRIVATE_KEY_PEM_BASE64
        sync: false
      - key: LICENSE_PUBLIC_KEY_PEM_BASE64
        sync: false
      - key: LICENSE_KEY_ID
        value: default
      - key: RECOVERY_PRIVATE_KEY_PEM_BASE64
        sync: false
      - key: RECOVERY_KEY_ID
        value: recovery-2026
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYMENT_LINK_SECRET
        sync: false

  - type: web
    name: project-x-admin
    runtime: static
    rootDir: .
    buildCommand: npm ci --include=dev && npm --workspace @project-x/admin run build
    staticPublishPath: apps/admin/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_DEALER_SLUG
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html